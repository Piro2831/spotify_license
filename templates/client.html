<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotifyアカウント受取ページ</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 90vh; }
        .container { width: 100%; max-width: 450px; background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #1db954; margin-bottom: 20px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input { padding: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 1em; text-align: center; }
        button { padding: 12px; background: #1db954; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em; }
        button:hover { background: #1aa34a; }
        .error { background: rgba(255, 0, 0, 0.2); border: 1px solid #ff4444; color: #ff4444; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .result-box { background: #2a2a2a; border: 1px solid #1db954; padding: 15px; border-radius: 4px; margin-top: 20px; text-align: left; }
        .result-box p { margin: 8px 0; word-break: break-all; }
        .label { color: #aaa; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spotifyアカウント受取</h1>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if account %}
            <div class="result-box">
                <p><strong>認証成功！アカウント情報はこちらです：</strong></p>
                <p><span class="label">メールアドレス:</span><br><code>{{ account.email }}</code></p>
                <p><span class="label">パスワード:</span><br><code>{{ account.password }}</code></p>
            </div>
            <p style="margin-top: 20px; font-size: 0.9em; color: #888;">※この情報は再度表示されないため、必ず保存してください。</p>
        {% else %}
<form action="/" method="POST">
                <input type="text" name="license_key" placeholder="ライセンスキーを入力" required autocomplete="off">
                <button type="submit">アカウントを発行する</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
